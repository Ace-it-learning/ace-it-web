<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening Mock Generator - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .topic-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .topic-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .topic-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border-left: 4px solid #667eea;
        }

        .status h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .log-entry {
            padding: 10px;
            margin: 5px 0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .log-success {
            background: #d4edda;
            color: #155724;
            border-left: 3px solid #28a745;
        }

        .log-error {
            background: #f8d7da;
            color: #721c24;
            border-left: 3px solid #dc3545;
        }

        .log-info {
            background: #d1ecf1;
            color: #0c5460;
            border-left: 3px solid #17a2b8;
        }

        .stats {
            display: flex;
            gap: 20px;
            margin-top: 15px;
        }

        .stat-box {
            flex: 1;
            background: white;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .stat-number {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            font-size: 12px;
            color: #666;
            margin-top: 5px;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-left: 10px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🎧 Listening Mock Generator</h1>
        <p class="subtitle">Generate HKDSE Paper 3 Listening Mock Exams with Multi-Document Data Files</p>

        <div class="topic-grid" id="topicGrid">
            <!-- Buttons will be inserted here -->
        </div>

        <div class="status">
            <h3>Generation Status</h3>
            <div id="statusLog"></div>
            <div class="stats" id="stats" style="display: none;">
                <div class="stat-box">
                    <div class="stat-number" id="successCount">0</div>
                    <div class="stat-label">Successful</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="failCount">0</div>
                    <div class="stat-label">Failed</div>
                </div>
                <div class="stat-box">
                    <div class="stat-number" id="totalDocs">0</div>
                    <div class="stat-label">Total Documents</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOPICS = [
            "School Open Day",
            "Environmental Conservation Campaign",
            "Student Council Election",
            "Sports Day Planning",
            "Cultural Festival Organization",
            "Career Fair Preparation"
        ];

        let successCount = 0;
        let failCount = 0;
        let totalDocs = 0;

        // Create topic buttons
        const topicGrid = document.getElementById('topicGrid');
        TOPICS.forEach(topic => {
            const btn = document.createElement('button');
            btn.className = 'topic-btn';
            btn.textContent = topic;
            btn.onclick = () => generateMock(topic, btn);
            topicGrid.appendChild(btn);
        });

        function addLog(message, type = 'info') {
            const log = document.getElementById('statusLog');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function updateStats() {
            document.getElementById('stats').style.display = 'flex';
            document.getElementById('successCount').textContent = successCount;
            document.getElementById('failCount').textContent = failCount;
            document.getElementById('totalDocs').textContent = totalDocs;
        }

        async function generateMock(topic, button) {
            button.disabled = true;
            button.innerHTML = topic + ' <span class="spinner"></span>';

            addLog(`Starting generation for: ${topic}`, 'info');

            try {
                const response = await fetch('http://localhost:3001/api/admin/generate-listening-mock', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ topic })
                });

                const data = await response.json();

                if (data.success) {
                    successCount++;
                    totalDocs += data.stats.partBDocuments || 0;
                    addLog(`✅ Generated: ${data.filename}`, 'success');
                    addLog(`   Part A Tasks: ${data.stats.partATasks}, Part B Docs: ${data.stats.partBDocuments}, Part B Tasks: ${data.stats.partBTasks}`, 'success');
                    button.innerHTML = topic + ' ✅';
                    button.style.background = 'linear-gradient(135deg, #28a745 0%, #20c997 100%)';
                } else {
                    throw new Error(data.message || 'Generation failed');
                }

            } catch (error) {
                failCount++;
                addLog(`❌ Failed: ${topic} - ${error.message}`, 'error');
                button.innerHTML = topic + ' ❌';
                button.style.background = 'linear-gradient(135deg, #dc3545 0%, #c82333 100%)';
            } finally {
                updateStats();
                button.disabled = false;
            }
        }

        // Initial log
        addLog('Ready to generate mocks. Click any topic to start.', 'info');
    </script>
</body>

</html>
