<!DOCTYPE html>
<html>

<head>
    <title>API Diagnostic</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
        }

        .exam {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
        }

        .error {
            color: red;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>Listening Mock List Diagnostic</h1>
    <button onclick="fetchExams()">Fetch My Mocks</button>
    <div id="status"></div>
    <div id="results"></div>

    <script>
        async function fetchExams() {
            const status = document.getElementById('status');
            const results = document.getElementById('results');
            status.innerText = 'Fetching...';
            results.innerHTML = '';

            try {
                const res = await fetch('http://localhost:3001/api/listening/exams');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                status.innerText = `Found ${data.length} exams.`;

                data.forEach(exam => {
                    const div = document.createElement('div');
                    div.className = 'exam';
                    div.innerHTML = `
                        <strong>Title:</strong> ${exam.title}<br>
                        <strong>ID:</strong> ${exam.id}<br>
                        <strong>Date:</strong> ${exam.date}
                    `;
                    results.appendChild(div);
                });
            } catch (err) {
                status.innerHTML = `<span class="error">Error: ${err.message}</span>`;
                console.error(err);
            }
        }
    </script>
</body>

</html>
