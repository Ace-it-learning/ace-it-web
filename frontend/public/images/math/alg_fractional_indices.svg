<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">FRACTIONAL INDICES</text>
  
  <g transform="translate(90, 180)" filter="url(#glow)">
    <text x="0" y="0" font-family="serif" font-size="48" font-style="italic" fill="#C7D2FE">a</text>
    <text x="25" y="-30" font-family="serif" font-size="18" font-style="italic" fill="#6EE7B7">m</text>
    <path d="M 23 -25 L 45 -25" stroke="#C7D2FE" stroke-width="2" />
    <text x="25" y="-10" font-family="serif" font-size="18" font-style="italic" fill="#FCA5A5">n</text>
    
    <text x="60" y="0" font-family="serif" font-size="48" fill="#C7D2FE"> = </text>
    
    <path d="M 110 -15 L 120 -15 L 128 0 L 140 -40 L 190 -40" stroke="#C7D2FE" stroke-width="3" fill="none" />
    <text x="110" y="-20" font-family="serif" font-size="18" font-style="italic" fill="#FCA5A5">n</text>
    
    <text x="145" y="0" font-family="serif" font-size="48" font-style="italic" fill="#C7D2FE">a</text>
    <text x="170" y="-20" font-family="serif" font-size="24" font-style="italic" fill="#6EE7B7">m</text>
  </g>
</svg>
