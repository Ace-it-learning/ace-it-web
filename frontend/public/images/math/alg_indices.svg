<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">LAWS OF INDICES</text>
  
  <g transform="translate(60, 180)" filter="url(#glow)">
    <text x="0" y="0" font-family="serif" font-size="48" font-style="italic" fill="#C7D2FE">a</text>
    <text x="25" y="-20" font-family="serif" font-size="24" font-style="italic" fill="#6EE7B7">m</text>
    <text x="50" y="0" font-family="serif" font-size="48" fill="#C7D2FE"> × </text>
    <text x="100" y="0" font-family="serif" font-size="48" font-style="italic" fill="#C7D2FE">a</text>
    <text x="125" y="-20" font-family="serif" font-size="24" font-style="italic" fill="#FCA5A5">n</text>
    <text x="150" y="0" font-family="serif" font-size="48" fill="#C7D2FE"> = </text>
    <text x="200" y="0" font-family="serif" font-size="48" font-style="italic" fill="#C7D2FE">a</text>
    <text x="225" y="-20" font-family="serif" font-size="24" font-style="italic" fill="#6EE7B7">m</text>
    <text x="245" y="-20" font-family="serif" font-size="24" fill="#C7D2FE">+</text>
    <text x="260" y="-20" font-family="serif" font-size="24" font-style="italic" fill="#FCA5A5">n</text>
  </g>
</svg>
