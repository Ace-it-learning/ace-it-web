<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">LOGARITHM RULES</text>
  
  <g transform="translate(30, 180)" filter="url(#glow)">
    <text x="0" y="0" font-family="serif" font-size="40" fill="#C7D2FE">log</text>
    <text x="50" y="10" font-family="serif" font-size="16" font-style="italic" fill="#C7D2FE">a</text>
    <text x="65" y="0" font-family="serif" font-size="40" fill="#C7D2FE">( </text>
    <text x="75" y="0" font-family="serif" font-size="40" font-style="italic" fill="#6EE7B7">x</text>
    <text x="95" y="0" font-family="serif" font-size="40" font-style="italic" fill="#FCA5A5">y</text>
    <text x="115" y="0" font-family="serif" font-size="40" fill="#C7D2FE"> ) = </text>
    
    <text x="180" y="0" font-family="serif" font-size="40" fill="#C7D2FE">log</text>
    <text x="230" y="10" font-family="serif" font-size="16" font-style="italic" fill="#C7D2FE">a</text>
    <text x="245" y="0" font-family="serif" font-size="40" font-style="italic" fill="#6EE7B7">x</text>
    
    <text x="270" y="0" font-family="serif" font-size="40" fill="#C7D2FE"> + </text>
    
    <text x="310" y="0" font-family="serif" font-size="40" fill="#C7D2FE">log</text>
    <text x="360" y="10" font-family="serif" font-size="16" font-style="italic" fill="#C7D2FE">a</text>
    <text x="375" y="0" font-family="serif" font-size="40" font-style="italic" fill="#FCA5A5">y</text>
  </g>
</svg>
