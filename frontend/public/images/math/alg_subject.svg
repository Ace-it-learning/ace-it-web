<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="80" font-family="sans-serif" font-size="28" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">CHANGE OF SUBJECT</text>
  
  <g transform="translate(60, 160)" filter="url(#glow)">
    <text x="0" y="0" font-family="serif" font-size="48" font-style="italic" fill="#C7D2FE">y = </text>
    <text x="80" y="0" font-family="serif" font-size="48" font-style="italic" fill="#6EE7B7">m</text>
    <text x="120" y="0" font-family="serif" font-size="48" font-style="italic" fill="#FCA5A5">x</text>
    <text x="150" y="0" font-family="serif" font-size="48" font-style="italic" fill="#C7D2FE"> + c</text>
  </g>

  <path d="M 230 190 Q 230 250 170 250 L 150 250" fill="none" stroke="#FDE047" stroke-width="4" stroke-dasharray="6,6"/>
  <polygon points="140,250 155,240 155,260" fill="#FDE047"/>
  
  <text x="200" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FDE047" text-anchor="middle">ISOLATE TARGET VARIABLE</text>
</svg>
