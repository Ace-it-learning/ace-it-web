<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="70" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="2">ALGEBRAIC SUBSTITUTION</text>

  <g transform="translate(60, 160)">
    <text x="0" y="0" font-family="serif" font-size="48" font-style="italic" fill="white">f(</text>
    <text x="40" y="0" font-family="serif" font-size="48" font-style="italic" fill="#FCA5A5">x</text>
    <text x="70" y="0" font-family="serif" font-size="48" font-style="italic" fill="white">) = 3</text>
    <text x="160" y="0" font-family="serif" font-size="48" font-style="italic" fill="#FCA5A5">x</text>
    <text x="190" y="-20" font-family="serif" font-size="24" font-style="italic" fill="white">2</text>
    <text x="220" y="0" font-family="serif" font-size="48" font-style="italic" fill="white"> - 5</text>
  </g>

  <!-- Plug in value arrow -->
  <path d="M 220 250 Q 180 200 170 170" fill="none" stroke="#FDE047" stroke-width="4" stroke-dasharray="8,4"/>
  <polygon points="168,160 160,175 178,175" fill="#FDE047"/>
  
  <rect x="200" y="230" width="80" height="40" rx="10" fill="#FDE047"/>
  <text x="240" y="258" font-family="serif" font-size="24" font-weight="bold" fill="#78350F" text-anchor="middle">(-2)</text>
</svg>
