<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">ADDITION &amp; SUBTRACTION</text>
  
  <g transform="translate(40, 140)" font-family="serif" font-size="32" font-style="italic">
    <text x="0" y="0" fill="white">(a + bi) ± (c + di)</text>
    <text x="0" y="60" fill="white">= (</text>
    <text x="35" y="60" fill="#6EE7B7">a ± c</text>
    <text x="110" y="60" fill="white">) + (</text>
    <text x="165" y="60" fill="#FCA5A5">b ± d</text>
    <text x="240" y="60" fill="white">)i</text>
  </g>
  
  <rect x="30" y="100" width="340" height="120" fill="none" stroke="white" stroke-width="1" stroke-dasharray="5,5" rx="10"/>
  
  <text x="200" y="240" font-family="sans-serif" font-size="14" fill="#6EE7B7" text-anchor="middle">Group Real Parts</text>
  <text x="200" y="260" font-family="sans-serif" font-size="14" fill="#FCA5A5" text-anchor="middle">Group Imaginary Parts</text>
</svg>
