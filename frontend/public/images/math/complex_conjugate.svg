<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">COMPLEX CONJUGATE</text>
  
  <g transform="translate(80, 140)" font-family="serif" font-size="48" font-style="italic">
    <text x="0" y="0" fill="white">z = a + bi</text>
    <text x="0" y="80" fill="#C7D2FE">z̄ = a - bi</text>
  </g>
  
  <g transform="translate(60, 240)" font-family="sans-serif" font-size="16" fill="white">
    <text x="0" y="0">z · z̄ = (a+bi)(a-bi)</text>
    <text x="0" y="25" font-weight="bold" fill="#6EE7B7">= a² + b² (Real Number)</text>
  </g>
</svg>
