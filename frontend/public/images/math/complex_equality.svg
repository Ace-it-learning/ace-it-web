<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">EQUALITY</text>
  
  <g transform="translate(60, 140)" font-family="serif" font-size="40" font-style="italic">
    <text x="0" y="0" fill="white">a + bi = c + di</text>
  </g>
  
  <g transform="translate(200, 200)" font-family="serif" font-size="32" font-style="italic" text-anchor="middle">
    <text x="0" y="0" fill="white">⟺</text>
    <g transform="translate(0, 40)">
      <text x="0" y="0" fill="#6EE7B7">a = c</text>
      <text x="0" y="40" fill="#FCA5A5">b = d</text>
    </g>
  </g>
  
  <line x1="75" y1="150" x2="140" y2="230" stroke="#6EE7B7" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="165" y1="150" x2="260" y2="230" stroke="#FCA5A5" stroke-width="2" stroke-dasharray="5,5"/>
</svg>
