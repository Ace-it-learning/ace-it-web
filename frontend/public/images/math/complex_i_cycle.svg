<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">POWERS OF i (CYCLE)</text>
  
  <g transform="translate(200, 160)" font-family="serif" font-size="32" font-style="italic">
    <!-- i^1 -->
    <g transform="translate(0, -80)">
      <text x="0" y="0" fill="#C7D2FE" text-anchor="middle">i<tspan font-size="18" baseline-shift="super">1</tspan> = i</text>
    </g>
    <!-- i^2 -->
    <g transform="translate(80, 0)">
      <text x="0" y="0" fill="#6EE7B7" text-anchor="middle">i<tspan font-size="18" baseline-shift="super">2</tspan> = -1</text>
    </g>
    <!-- i^3 -->
    <g transform="translate(0, 80)">
      <text x="0" y="0" fill="#FCA5A5" text-anchor="middle">i<tspan font-size="18" baseline-shift="super">3</tspan> = -i</text>
    </g>
    <!-- i^4 -->
    <g transform="translate(-80, 0)">
      <text x="0" y="0" fill="#FDE047" text-anchor="middle">i<tspan font-size="18" baseline-shift="super">4</tspan> = 1</text>
    </g>
    
    <!-- Arrows -->
    <path d="M 20 -70 Q 70 -70 70 -20" fill="none" stroke="white" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M 70 20 Q 70 70 20 70" fill="none" stroke="white" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M -20 70 Q -70 70 -70 20" fill="none" stroke="white" stroke-width="2" marker-end="url(#arrow)"/>
    <path d="M -70 -20 Q -70 -70 -20 -70" fill="none" stroke="white" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="white" />
    </marker>
  </defs>
</svg>
