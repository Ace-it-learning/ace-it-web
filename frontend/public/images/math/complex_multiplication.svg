<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">MULTIPLICATION (FOIL)</text>
  
  <g transform="translate(50, 140)" font-family="serif" font-size="32" font-style="italic">
    <text x="0" y="0" fill="white">(a + bi)(c + di)</text>
    <text x="0" y="60" fill="white">= ac + adi + bci + bdi</text>
    <tspan font-size="18" baseline-shift="super">2</tspan>
    <text x="0" y="110" fill="white">= (</text>
    <text x="35" y="110" fill="#6EE7B7">ac - bd</text>
    <text x="140" y="110" fill="white">) + (</text>
    <text x="195" y="110" fill="#FCA5A5">ad + bc</text>
    <text x="300" y="110" fill="white">)i</text>
  </g>
  
  <text x="200" y="260" font-family="sans-serif" font-size="14" fill="#FDE047" text-anchor="middle">Remember: i² = -1</text>
</svg>
