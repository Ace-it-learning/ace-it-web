<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="20"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">STANDARD FORM</text>
  
  <g transform="translate(100, 160)" font-family="serif" font-size="64" font-style="italic">
    <text x="0" y="0" fill="white">z = </text>
    <text x="80" y="0" fill="#6EE7B7">a</text>
    <text x="120" y="0" fill="white"> + </text>
    <text x="170" y="0" fill="#FCA5A5">b</text>
    <text x="210" y="0" fill="#C7D2FE">i</text>
  </g>
  
  <!-- Labels -->
  <g font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
    <path d="M 190 170 Q 190 220 180 220" fill="none" stroke="#6EE7B7" stroke-width="2" marker-end="url(#arrow-green)"/>
    <text x="180" y="240" fill="#6EE7B7">REAL PART (Re)</text>
    
    <path d="M 280 170 Q 280 220 290 220" fill="none" stroke="#FCA5A5" stroke-width="2" marker-end="url(#arrow-red)"/>
    <text x="290" y="240" fill="#FCA5A5">IMAGINARY PART (Im)</text>
  </g>
  
  <defs>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#6EE7B7" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M 10 0 L 0 5 L 10 10 z" fill="#FCA5A5" />
    </marker>
  </defs>
</svg>
