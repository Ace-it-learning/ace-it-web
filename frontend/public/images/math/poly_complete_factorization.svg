<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#155E75"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="20" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">COMPLETE FACTORIZATION</text>
  
  <g transform="translate(50, 100)">
    <circle cx="20" cy="0" r="15" fill="#6EE7B7"/>
    <text x="20" y="5" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">1</text>
    <text x="45" y="5" font-family="sans-serif" font-size="18" fill="white">Find Trial Root</text>

    <circle cx="20" cy="60" r="15" fill="#6EE7B7"/>
    <text x="20" y="65" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">2</text>
    <text x="45" y="65" font-family="sans-serif" font-size="18" fill="white">Polynomial Division</text>

    <circle cx="20" cy="120" r="15" fill="#6EE7B7"/>
    <text x="20" y="125" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">3</text>
    <text x="45" y="125" font-family="sans-serif" font-size="18" fill="white">Factorize Quadratic</text>
  </g>

  <rect x="50" y="245" width="300" height="40" rx="5" fill="white" fill-opacity="0.1"/>
  <text x="200" y="272" font-family="serif" font-size="20" font-style="italic" fill="#FDE047" text-anchor="middle">(x-1)(x-2)(x-3)</text>
</svg>
