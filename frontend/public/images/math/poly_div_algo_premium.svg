<svg width="600" height="150" viewBox="0 0 600 150" fill="none" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
        </linearGradient>
      </defs>
      <!-- Dividend -->
      <rect x="20" y="40" width="120" height="70" rx="12" fill="url(#grad1)" />
      <text x="80" y="80" text-anchor="middle" fill="white" font-family="Inter, system-ui" font-weight="bold" font-size="16">Dividend</text>
      <text x="80" y="100" text-anchor="middle" fill="white" font-family="Inter, system-ui" font-size="14">f(x)</text>

      <path d="M150 75 L 180 75" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)" />
      <text x="165" y="65" text-anchor="middle" fill="#94a3b8" font-family="Inter" font-size="20">≡</text>

      <!-- Divisor -->
      <rect x="190" y="40" width="100" height="70" rx="12" stroke="#6366f1" stroke-width="2" />
      <text x="240" y="80" text-anchor="middle" fill="#6366f1" font-family="Inter" font-weight="bold" font-size="16">Divisor</text>
      <text x="240" y="100" text-anchor="middle" fill="#6366f1" font-family="Inter" font-size="14">d(x)</text>

      <text x="300" y="80" text-anchor="middle" fill="#94a3b8" font-family="Inter" font-size="20">×</text>

      <!-- Quotient -->
      <rect x="310" y="40" width="100" height="70" rx="12" stroke="#8b5cf6" stroke-width="2" />
      <text x="360" y="80" text-anchor="middle" fill="#8b5cf6" font-family="Inter" font-weight="bold" font-size="16">Quotient</text>
      <text x="360" y="100" text-anchor="middle" fill="#8b5cf6" font-family="Inter" font-size="14">Q(x)</text>

      <text x="420" y="80" text-anchor="middle" fill="#94a3b8" font-family="Inter" font-size="20">+</text>

      <!-- Remainder -->
      <rect x="430" y="40" width="120" height="70" rx="12" fill="#ec4899" fill-opacity="0.1" stroke="#ec4899" stroke-width="2" />
      <text x="490" y="80" text-anchor="middle" fill="#ec4899" font-family="Inter" font-weight="bold" font-size="16">Remainder</text>
      <text x="490" y="100" text-anchor="middle" fill="#ec4899" font-family="Inter" font-size="14">R(x)</text>

      <defs>
        <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" />
        </marker>
      </defs>
    </svg>