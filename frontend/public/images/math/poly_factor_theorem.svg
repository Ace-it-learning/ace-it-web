<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="60" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">FACTOR THEOREM</text>
  
  <g transform="translate(60, 130)" filter="url(#glow)">
    <text x="0" y="0" font-family="serif" font-size="42" font-style="italic" fill="#FDE047">f(a) = 0</text>
  </g>

  <path d="M 200 150 L 200 210" fill="none" stroke="white" stroke-width="4" stroke-dasharray="8,4"/>
  <polygon points="200,225 190,210 210,210" fill="white"/>
  
  <g transform="translate(60, 260)">
    <text x="0" y="0" font-family="serif" font-size="32" font-weight="bold" fill="white">(x - a) is a </text>
    <text x="175" y="0" font-family="serif" font-size="32" font-weight="bold" fill="#6EE7B7">FACTOR</text>
  </g>

  <text x="200" y="285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FCA5A5" text-anchor="middle">NO REMAINDER LEFT</text>
</svg>
