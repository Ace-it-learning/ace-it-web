<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">FINDING UNKNOWN CONSTANTS</text>
  
  <g transform="translate(60, 110)" filter="url(#glow)">
    <rect x="-10" y="-35" width="280" height="120" rx="10" fill="white" fill-opacity="0.1" stroke="white" stroke-width="1"/>
    <text x="10" y="5" font-family="serif" font-size="28" font-style="italic" fill="#C7D2FE">1. f(1) = 0</text>
    <text x="10" y="55" font-family="serif" font-size="28" font-style="italic" fill="#C7D2FE">2. f(-2) = 0</text>
  </g>

  <g transform="translate(60, 240)">
    <text x="0" y="0" font-family="serif" font-size="36" font-weight="bold" fill="#6EE7B7">Solve for a, b</text>
  </g>

  <path d="M 280 110 L 330 110 L 330 240 L 300 240" fill="none" stroke="#FDE047" stroke-width="3" stroke-dasharray="4,4"/>
  <polygon points="290,240 305,230 305,250" fill="#FDE047"/>

  <text x="200" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FDE047" text-anchor="middle">USE SIMULTANEOUS EQUATIONS</text>
</svg>
