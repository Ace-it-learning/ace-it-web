<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="60" font-family="sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">GENERAL LINEAR DIVISOR</text>
  
  <g transform="translate(40, 140)" filter="url(#glow)">
    <text x="0" y="0" font-family="serif" font-size="36" font-style="italic" fill="#C7D2FE">f(x) ÷ (</text>
    <text x="110" y="0" font-family="serif" font-size="36" font-style="italic" fill="#FCA5A5">a</text>
    <text x="130" y="0" font-family="serif" font-size="36" font-style="italic" fill="#C7D2FE">x - </text>
    <text x="180" y="0" font-family="serif" font-size="36" font-style="italic" fill="#FCA5A5">b</text>
    <text x="200" y="0" font-family="serif" font-size="36" font-style="italic" fill="#C7D2FE">)</text>
  </g>

  <path d="M 210 155 Q 210 215 140 215" fill="none" stroke="#FDE047" stroke-width="4" stroke-dasharray="6,6"/>
  <polygon points="125,215 140,205 140,225" fill="#FDE047"/>
  
  <text x="130" y="240" font-family="serif" font-size="28" font-style="italic" fill="#FDE047" text-anchor="middle">x = b/a</text>

  <g transform="translate(240, 215)">
    <text x="0" y="0" font-family="serif" font-size="36" font-weight="bold" fill="#6EE7B7">f(b/a)</text>
  </g>

  <text x="200" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="#6EE7B7" text-anchor="middle">SET DIVISOR = 0 TO FIND X</text>
</svg>
