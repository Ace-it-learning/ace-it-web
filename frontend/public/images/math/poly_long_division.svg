<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="22" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">LONG DIVISION</text>
  
  <g transform="translate(80, 100)">
    <text x="100" y="-10" font-family="serif" font-size="24" fill="#6EE7B7" text-anchor="middle">Quotient</text>
    <path d="M 0 0 L 220 0 M 0 0 L 0 100" stroke="white" stroke-width="3"/>
    <text x="-70" y="50" font-family="serif" font-size="24" fill="#FCA5A5">Divisor</text>
    <text x="100" y="50" font-family="serif" font-size="24" fill="#C7D2FE" text-anchor="middle">Dividend</text>
    
    <text x="100" y="140" font-family="serif" font-size="24" fill="#FDE047" text-anchor="middle">Remainder</text>
    <path d="M 50 110 L 150 110" stroke="#FDE047" stroke-width="2" stroke-dasharray="4,4"/>
  </g>

  <text x="200" y="280" font-family="sans-serif" font-size="14" font-weight="bold" fill="white" text-anchor="middle">DESCENDING ORDER OF POWERS</text>
</svg>
