<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">REMAINDER THEOREM</text>
  
  <g transform="translate(60, 130)" filter="url(#glow)">
    <text x="0" y="0" font-family="serif" font-size="36" font-style="italic" fill="#C7D2FE">f(x) ÷ (x - a)</text>
  </g>

  <path d="M 200 150 Q 200 200 180 200" fill="none" stroke="#6EE7B7" stroke-width="4" stroke-dasharray="6,6"/>
  <polygon points="170,200 185,192 185,208" fill="#6EE7B7"/>
  
  <g transform="translate(60, 240)">
    <text x="0" y="0" font-family="serif" font-size="36" font-weight="bold" fill="#6EE7B7">Remainder = </text>
    <text x="210" y="0" font-family="serif" font-size="36" font-weight="bold" fill="#FCA5A5">f(a)</text>
  </g>

  <text x="200" y="285" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FDE047" text-anchor="middle">SUBSTITUTE TO FIND REMAINDER</text>
</svg>
