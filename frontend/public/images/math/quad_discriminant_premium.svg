<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  
  <text x="200" y="45" font-family="sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">DISCRIMINANT ANALYSIS</text>
  <text x="200" y="80" font-family="serif" font-size="32" font-style="italic" fill="#C7D2FE" text-anchor="middle" filter="url(#glow)">Δ = b² - 4ac</text>

  <!-- Table/Cases -->
  <g transform="translate(40, 110)">
    <!-- Case 1 -->
    <rect x="0" y="0" width="100" height="110" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#34D399" stroke-width="2"/>
    <text x="50" y="40" font-family="serif" font-size="24" font-weight="bold" fill="#34D399" text-anchor="middle">Δ &gt; 0</text>
    <circle cx="25" cy="75" r="4" fill="#34D399"/>
    <circle cx="75" cy="75" r="4" fill="#34D399"/>
    <text x="50" y="100" font-family="sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">2 Distinct Roots</text>
    
    <!-- Case 2 -->
    <rect x="110" y="0" width="100" height="110" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#FBBF24" stroke-width="2"/>
    <text x="160" y="40" font-family="serif" font-size="24" font-weight="bold" fill="#FBBF24" text-anchor="middle">Δ = 0</text>
    <circle cx="160" cy="75" r="5" fill="#FBBF24"/>
    <text x="160" y="100" font-family="sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">1 Real Root</text>
    
    <!-- Case 3 -->
    <rect x="220" y="0" width="100" height="110" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#F87171" stroke-width="2"/>
    <text x="270" y="40" font-family="serif" font-size="24" font-weight="bold" fill="#F87171" text-anchor="middle">Δ &lt; 0</text>
    <line x1="250" y1="75" x2="290" y2="75" stroke="#F87171" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="270" y="100" font-family="sans-serif" font-size="12" font-weight="600" fill="white" text-anchor="middle">0 Real Roots</text>
  </g>

  <rect x="50" y="245" width="300" height="30" rx="10" fill="#4338CA"/>
  <text x="200" y="265" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E0E7FF" text-anchor="middle" letter-spacing="1">DETERMINES NATURE OF ROOTS</text>
</svg>
