<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">FACTOR METHOD</text>
  
  <text x="200" y="100" font-family="serif" font-size="28" fill="#FFFFFF" text-anchor="middle">x² - 5x + 6 = 0</text>

  <!-- Cross Method Diagram -->
  <g transform="translate(140, 140)">
    <!-- Column 1 -->
    <text x="0" y="0" font-family="serif" font-size="24" fill="#FCA5A5">x</text>
    <text x="0" y="60" font-family="serif" font-size="24" fill="#FCA5A5">x</text>
    
    <!-- Column 2 -->
    <text x="100" y="0" font-family="serif" font-size="24" fill="#6EE7B7">-2</text>
    <text x="100" y="60" font-family="serif" font-size="24" fill="#6EE7B7">-3</text>
    
    <!-- Cross Lines -->
    <line x1="20" y1="5" x2="90" y2="55" stroke="white" stroke-width="2" opacity="0.6"/>
    <line x1="20" y1="55" x2="90" y2="5" stroke="white" stroke-width="2" opacity="0.6"/>
    
    <!-- Results -->
    <text x="140" y="0" font-family="serif" font-size="18" fill="#C7D2FE">→ -2x</text>
    <text x="140" y="60" font-family="serif" font-size="18" fill="#C7D2FE">→ -3x</text>
    
    <line x1="140" y1="75" x2="200" y2="75" stroke="white" stroke-width="1"/>
    <text x="140" y="95" font-family="serif" font-size="20" font-weight="bold" fill="#FDE047">-5x (Match!)</text>
  </g>

  <g transform="translate(200, 260)">
    <text x="0" y="0" font-family="serif" font-size="24" font-weight="bold" fill="#FFFFFF" text-anchor="middle">(x - 2)(x - 3) = 0</text>
  </g>
</svg>
