<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">QUADRATIC FORMULA</text>
  
  <text x="200" y="100" font-family="serif" font-size="22" fill="#C7D2FE" text-anchor="middle">For ax² + bx + c = 0</text>

  <g transform="translate(100, 180)" filter="url(#glow)">
    <!-- x = -->
    <text x="0" y="0" font-family="serif" font-size="40" font-style="italic" fill="white">x =</text>
    
    <!-- Fraction Line -->
    <line x1="60" y1="-10" x2="260" y2="-10" stroke="white" stroke-width="3"/>
    
    <!-- Numerator -->
    <text x="160" y="-30" font-family="serif" font-size="30" fill="white" text-anchor="middle">
      <tspan fill="#FCA5A5">-b</tspan> ± √(<tspan fill="#FCA5A5">b</tspan>² - 4<tspan fill="#6EE7B7">a</tspan><tspan fill="#FDE047">c</tspan>)
    </text>
    
    <!-- Denominator -->
    <text x="160" y="40" font-family="serif" font-size="30" fill="white" text-anchor="middle">
      2<tspan fill="#6EE7B7">a</tspan>
    </text>
  </g>

  <text x="200" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FDE047" text-anchor="middle">USE WHEN FACTORIZATION IS IMPOSSIBLE</text>
</svg>
