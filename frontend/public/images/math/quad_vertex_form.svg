<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  
  <text x="200" y="50" font-family="sans-serif" font-size="24" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="1">VERTEX FORM</text>
  
  <text x="200" y="100" font-family="serif" font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">y = a(x - <tspan fill="#6EE7B7">h</tspan>)² + <tspan fill="#FCA5A5">k</tspan></text>

  <!-- Graph Illustration -->
  <g transform="translate(150, 130)">
    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="100" stroke="white" stroke-width="1" opacity="0.5"/>
    <line x1="-50" y1="80" x2="100" y2="80" stroke="white" stroke-width="1" opacity="0.5"/>
    
    <!-- Parabola -->
    <path d="M -30,20 Q 30,120 90,20" fill="none" stroke="#C7D2FE" stroke-width="3"/>
    
    <!-- Vertex Point -->
    <circle cx="30" cy="70" r="5" fill="#FDE047"/>
    <text x="40" y="65" font-family="sans-serif" font-size="14" fill="#FDE047" font-weight="bold">Vertex (<tspan fill="#6EE7B7">h</tspan>, <tspan fill="#FCA5A5">k</tspan>)</text>
  </g>

  <text x="200" y="270" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FDE047" text-anchor="middle">FIND THE MAX/MIN POINT INSTANTLY</text>
</svg>
