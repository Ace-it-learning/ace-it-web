<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  
  <text x="200" y="45" font-family="sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">VERTEX FORM</text>
  
  <text x="200" y="100" font-family="serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" filter="url(#glow)">y = a(x - <tspan fill="#FCA5A5">h</tspan>)² + <tspan fill="#6EE7B7">k</tspan></text>

  <!-- Details -->
  <g transform="translate(60, 140)">
    <rect x="0" y="0" width="280" height="90" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#C7D2FE" stroke-width="2"/>
    
    <text x="140" y="30" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FCA5A5" text-anchor="middle">Vertex: (<tspan font-family="serif" font-weight="normal">h</tspan>, <tspan fill="#6EE7B7" font-family="serif" font-weight="normal">k</tspan>)</text>
    
    <text x="140" y="55" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">Axis of Symmetry: <tspan font-family="serif" fill="#FCA5A5" font-style="italic">x = h</tspan></text>
    
    <text x="140" y="75" font-family="sans-serif" font-size="12" fill="#E0E7FF" text-anchor="middle">a &gt; 0 (Min)   |   a &lt; 0 (Max)</text>
  </g>

  <rect x="50" y="245" width="300" height="30" rx="10" fill="#4338CA"/>
  <text x="200" y="265" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E0E7FF" text-anchor="middle" letter-spacing="1">INSTANTANEOUS GRAPH PROPERTIES</text>
</svg>
