<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg)"/>
  
  <text x="200" y="45" font-family="sans-serif" font-size="20" font-weight="900" fill="white" text-anchor="middle" letter-spacing="2">RELATIONSHIPS BETWEEN ROOTS</text>
  <text x="200" y="80" font-family="serif" font-size="24" fill="#C7D2FE" text-anchor="middle">For roots α, β of ax² + bx + c = 0</text>

  <g transform="translate(60, 120)">
    <!-- Sum of Roots -->
    <rect x="0" y="0" width="280" height="60" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#FDE047" stroke-width="2"/>
    <text x="20" y="38" font-family="sans-serif" font-size="16" font-weight="bold" fill="#FDE047">SUM (α + β)</text>
    <text x="180" y="40" font-family="serif" font-size="28" font-weight="bold" fill="white" filter="url(#glow)">= -b/a</text>

    <!-- Product of Roots -->
    <rect x="0" y="80" width="280" height="60" rx="12" fill="#ffffff" fill-opacity="0.1" stroke="#6EE7B7" stroke-width="2"/>
    <text x="20" y="118" font-family="sans-serif" font-size="16" font-weight="bold" fill="#6EE7B7">PRODUCT (αβ)</text>
    <text x="180" y="120" font-family="serif" font-size="28" font-weight="bold" fill="white" filter="url(#glow)">= c/a</text>
  </g>

  <rect x="50" y="245" width="300" height="30" rx="10" fill="#4338CA"/>
  <text x="200" y="265" font-family="sans-serif" font-size="12" font-weight="bold" fill="#E0E7FF" text-anchor="middle" letter-spacing="1">VIETA'S FORMULAS</text>
</svg>
