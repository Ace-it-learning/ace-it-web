<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .axis { stroke: #666; stroke-width: 2; }
      .grid { stroke: #333; stroke-width: 1; stroke-dasharray: 4 4; }
      .line-direct { fill: none; stroke: #4f8aff; stroke-width: 3; }
      .line-inverse { fill: none; stroke: #ff4f81; stroke-width: 3; }
      .text { font-family: sans-serif; fill: #ddd; font-size: 14px; }
      .title { font-size: 16px; font-weight: bold; fill: #fff; }
      .math { font-family: serif; font-style: italic; font-size: 16px; fill: #4f8aff; }
      .math-inv { font-family: serif; font-style: italic; font-size: 16px; fill: #ff4f81; }
    </style>
  </defs>

  <rect width="600" height="300" class="bg"/>

  <!-- DIRECT PROPORTION (Left) -->
  <text x="150" y="30" class="title" text-anchor="middle">Direct Proportion</text>
  <text x="150" y="55" class="math" text-anchor="middle">y ∝ x (y = kx)</text>

  <line x1="50" y1="250" x2="250" y2="250" class="axis"/>
  <line x1="50" y1="250" x2="50" y2="80" class="axis"/>
  <text x="245" y="265" class="text" text-anchor="middle">x</text>
  <text x="35" y="90" class="text" text-anchor="middle">y</text>
  <text x="35" y="265" class="text" text-anchor="middle">0</text>
  
  <line x1="50" y1="250" x2="230" y2="100" class="line-direct"/>
  <circle cx="140" cy="175" r="4" fill="#4f8aff"/>
  <text x="155" y="175" class="text">Ratio y/x is constant</text>


  <!-- INVERSE PROPORTION (Right) -->
  <text x="450" y="30" class="title" text-anchor="middle">Inverse Proportion</text>
  <text x="450" y="55" class="math-inv" text-anchor="middle">y ∝ 1/x (y = k/x)</text>

  <line x1="350" y1="250" x2="550" y2="250" class="axis"/>
  <line x1="350" y1="250" x2="350" y2="80" class="axis"/>
  <text x="545" y="265" class="text" text-anchor="middle">x</text>
  <text x="335" y="90" class="text" text-anchor="middle">y</text>
  <text x="335" y="265" class="text" text-anchor="middle">0</text>

  <!-- Hyperbola curve -->
  <path d="M 370 100 Q 380 230 530 240" class="line-inverse"/>
  <circle cx="410" cy="165" r="4" fill="#ff4f81"/>
  <text x="425" y="155" class="text">Product xy is constant</text>

</svg>
