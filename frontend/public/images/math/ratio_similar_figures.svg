<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .shape-small { fill: rgba(79, 138, 255, 0.3); stroke: #4f8aff; stroke-width: 2; }
      .shape-large { fill: rgba(255, 79, 129, 0.3); stroke: #ff4f81; stroke-width: 2; }
      .text { font-family: sans-serif; fill: #ddd; font-size: 14px; }
      .title { font-size: 16px; font-weight: bold; fill: #fff; }
      .math { font-family: serif; font-style: italic; font-size: 16px; fill: #00e676; }
      .highlight { fill: #00e676; font-weight: bold; }
    </style>
  </defs>

  <rect width="600" height="300" class="bg"/>

  <text x="300" y="30" class="title" text-anchor="middle">Similar Figures: Length vs Area vs Volume Ratios</text>

  <!-- Figure 1 (Small Base) -->
  <polygon points="150,150 100,250 200,250" class="shape-small"/>
  <text x="150" y="270" class="text" text-anchor="middle">Base = l₁</text>
  <text x="150" y="215" class="text" text-anchor="middle">Area = A₁</text>
  <text x="150" y="285" class="text" text-anchor="middle">Volume = V₁</text>
  
  <!-- Scale arrow -->
  <circle cx="270" cy="200" r="15" fill="#333" stroke="#555" stroke-width="2"/>
  <path d="M 230 200 L 255 200 M 285 200 L 310 200 L 300 190 M 310 200 L 300 210" fill="none" stroke="#888" stroke-width="2"/>
  <text x="270" y="205" class="highlight" text-anchor="middle">× k</text>

  <!-- Figure 2 (Large Base) -->
  <polygon points="450,50 350,250 550,250" class="shape-large"/>
  <text x="450" y="270" class="text" text-anchor="middle">Base = l₂ = <tspan class="highlight">k</tspan> · l₁</text>
  <text x="450" y="190" class="text" text-anchor="middle">Area = A₂ = <tspan class="highlight">k²</tspan> · A₁</text>
  <text x="450" y="285" class="text" text-anchor="middle">Volume = V₂ = <tspan class="highlight">k³</tspan> · V₁</text>

  <rect x="150" y="60" width="300" height="40" rx="5" fill="#333" stroke="#555"/>
  <text x="300" y="85" class="math" text-anchor="middle">l₁ : l₂ = 1 : k  |  A₁ : A₂ = 1 : k²  |  V₁ : V₂ = 1 : k³</text>
</svg>
