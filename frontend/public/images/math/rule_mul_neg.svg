<svg width="400" height="150" viewBox="0 0 400 150" xmlns="http://www.w3.org/2000/svg">
  <rect width="400" height="150" rx="15" fill="#fcf2f2"/>
  <text x="20" y="40" font-family="Arial" font-size="18" font-weight="bold" fill="#333" stroke="#ff0000" stroke-width="0.5">Rule 3: Multiply by NEGATIVE (k &lt; 0)</text>
  
  <g transform="translate(50, 70)">
    <text x="0" y="30" font-family="'Courier New', monospace" font-size="24" fill="#d9534f">x &lt; y</text>
    <text x="75" y="30" font-family="Arial" font-size="20" fill="#ff0000">!!!</text>
    <path d="M100,25 L140,25" stroke="#999" stroke-width="2" marker-end="url(#arrowhead)"/>
    <text x="160" y="30" font-family="'Courier New', monospace" font-size="24" fill="#d9534f">kx &gt; ky</text>
  </g>
  
  <text x="20" y="130" font-family="Arial" font-size="14" fill="#ff0000" font-weight="bold">THE INEQUALITY SIGN FLIPS!</text>
  
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="0" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#999" />
    </marker>
  </defs>
</svg>
