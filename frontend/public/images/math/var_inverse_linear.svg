<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1E293B" />
    </marker>
  </defs>
  <!-- Axes -->
  <line x1="40" y1="260" x2="360" y2="260" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="40" y1="260" x2="40" y2="40" stroke="#1E293B" stroke-width="2" marker-end="url(#arrow)" />
  <!-- Labels -->
  <text x="370" y="265" font-family="sans-serif" font-size="14" fill="#1E293B">1/x</text>
  <text x="35" y="30" font-family="sans-serif" font-size="14" fill="#1E293B">y</text>
  <text x="30" y="275" font-family="sans-serif" font-size="14" fill="#1E293B">O</text>
  <!-- Linear relationship y = k(1/x) -->
  <line x1="40" y1="260" x2="320" y2="60" stroke="#3B82F6" stroke-width="3" />
  <text x="240" y="80" font-family="sans-serif" font-size="16" font-weight="bold" fill="#3B82F6">y = k(1/x)</text>
</svg>
