<svg width="400" height="300" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <!-- Grid/Axes -->
  <line x1="50" y1="250" x2="350" y2="250" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="50" y1="250" x2="50" y2="50" stroke="#666" stroke-width="2" marker-end="url(#arrow)" />
  
  <!-- Partial Variation Line: y = c + mx -->
  <line x1="50" y1="180" x2="300" y2="70" stroke="#2196F3" stroke-width="4" stroke-linecap="round" />
  
  <!-- Labels -->
  <text x="360" y="255" fill="#aaa" font-family="Arial" font-size="14">x</text>
  <text x="45" y="40" fill="#aaa" font-family="Arial" font-size="14">y</text>
  <circle cx="50" cy="180" r="4" fill="#2196F3" />
  <text x="15" y="185" fill="#2196F3" font-family="Arial" font-size="12">c</text>
  <text x="180" y="100" fill="#2196F3" font-family="Arial" font-weight="bold" font-size="16">y = c + kx</text>
  
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#666" />
    </marker>
  </defs>
</svg>
